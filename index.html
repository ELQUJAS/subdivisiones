<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información Territorial de la Comuna de Villarrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <style>
        /* Define la fuente Inter */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilos para el scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* Colores personalizados basados en el logo */
        .bg-villarrica-blue { background-color: #007bff; /* Un azul vibrante */ }
        .text-villarrica-blue { color: #007bff; }
        .hover-bg-villarrica-blue-dark { background-color: #0056b3; }
        .bg-villarrica-orange { background-color: #FFA500; /* Naranja del sol */ }
        .hover-bg-villarrica-orange-dark { background-color: #CC8400; }
        .bg-villarrica-green { background-color: #28a745; /* Verde del árbol */ }
        .hover-bg-villarrica-green-dark { background-color: #1e7e34; }

        /* Estilos para que el mapa y los controles de Leaflet se integren */
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden; /* Evita el scroll global */
        }
        #map {
            flex-grow: 1;
            position: relative;
            background-color: #e0e0e0;
            border-radius: 1rem;
        }
        /* Posiciona los controles de Leaflet */
        .leaflet-control-zoom {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 1000;
        }
        .leaflet-control-layers {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 1000;
        }
        /* ESTILO para el visor de coordenadas */
        .coordinate-display.leaflet-control {
            position: absolute;
            bottom: 1.5rem;
            left: 1.5rem;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #rolSugerencias {
            position: absolute;
            z-index: 1001;
            width: calc(100% - 2.5rem);
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-top: none;
            background-color: white;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: none;
        }
        #rolSugerencias .sugerencia-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
            color: #555;
        }
        #rolSugerencias .sugerencia-item:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-green-100 h-screen flex flex-col">
    <header class="bg-villarrica-blue text-white p-4 shadow-xl flex items-center justify-between rounded-b-xl">
        <div class="flex items-center">
            <img src="color_sin_fondo.png" alt="Logo Municipalidad de Villarrica" class="h-16 w-16 mr-4 object-contain">
            <h1 class="text-3xl font-extrabold tracking-wide">INFORMACIÓN TERRITORIAL DE LA COMUNA DE VILLARRICA</h1>
        </div>
        <div class="flex space-x-8">
            <div class="flex flex-col items-center cursor-pointer hover:text-gray-200 transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m0 0l7 7m-2 2v10a1 1 0 001 1h3m-6-10v6a1 1 0 001 1h2a1 1 0 001-1v-6m-6 0H6" />
                </svg>
                <span class="text-xs mt-1">Inicio</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer hover:text-gray-200 transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 21h7a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
                <span class="text-xs mt-1">Buscar Rol</span>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden p-6">
        <div class="flex-1 bg-white p-4 flex items-center justify-center relative rounded-2xl shadow-2xl mr-6">
            <div id="map" class="absolute inset-0 z-0"></div>
        </div>

        <div id="sidebar-right" class="w-96 bg-white p-6 shadow-2xl flex flex-col space-y-6 overflow-y-auto rounded-2xl">
            <div class="bg-blue-50 p-5 rounded-xl shadow-inner border border-blue-200">
                <h2 class="text-2xl font-bold text-villarrica-blue mb-5">Buscadores</h2>
                <div class="space-y-4">
                    <div>
                        <label for="coordenadasInput" class="block text-sm font-medium text-gray-700 mb-1">Latitud, Longitud (Ej: -33.21, -71.24)</label>
                        <input type="text" id="coordenadasInput" placeholder="Latitud, Longitud" class="mt-1 block w-full p-3 border border-blue-300 rounded-lg shadow-sm focus:ring-villarrica-blue focus:border-villarrica-blue sm:text-base transition-all duration-200">
                    </div>
                    <button id="buscarCoordenadas" class="w-full bg-villarrica-blue text-white py-3 px-4 rounded-lg hover:bg-villarrica-blue-dark focus:outline-none focus:ring-2 focus:ring-villarrica-blue focus:ring-opacity-75 shadow-lg transform hover:-translate-y-0.5 transition-all duration-200">Buscar</button>
                    <div id="resultadoBusqueda" class="text-sm text-red-500 mt-2"></div>
                </div>
            </div>

            <div class="bg-green-50 p-5 rounded-xl shadow-inner border border-green-200">
                <h2 class="text-2xl font-bold text-villarrica-green mb-5">Buscar ROL</h2>
                <div class="space-y-4">
                    <div class="relative">
                        <label for="rolInput" class="block text-sm font-medium text-gray-700 mb-1">Buscar ROL (Ej: 1234-5)</label>
                        <input type="text" id="rolInput" placeholder="Buscar ROL" class="mt-1 block w-full p-3 border border-green-300 rounded-lg shadow-sm focus:ring-villarrica-green focus:border-villarrica-green sm:text-base transition-all duration-200">
                        <div id="rolSugerencias" class="absolute top-full left-0 mt-1 bg-white border border-gray-300 rounded-lg shadow-lg"></div>
                    </div>
                    <button id="buscarRol" class="w-full bg-villarrica-green text-white py-3 px-4 rounded-lg hover:bg-villarrica-green-dark focus:outline-none focus:ring-2 focus:ring-villarrica-green focus:ring-opacity-75 shadow-lg transform hover:-translate-y-0.5 transition-all duration-200">Buscar ROL</button>
                    <div id="resultadoBusquedaRol" class="text-sm text-red-500 mt-2"></div>
                </div>
            </div>

            <div class="bg-green-50 p-5 rounded-xl shadow-inner border border-green-200 flex-grow">
                <h2 class="text-2xl font-bold text-villarrica-green mb-5">Información de ROL</h2>
                <div id="rol-info-display" class="space-y-3">
                    <p class="text-gray-600">Aquí se mostrará la información del ROL buscado.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="data/Subdivisiones20232024_2.js"></script>
    <script>
        function customAlert(message) {
            const alertBox = document.createElement('div');
            alertBox.classList.add('custom-alert', 'bg-white', 'p-6', 'rounded-lg', 'shadow-xl', 'text-center', 'fixed', 'top-1/2', 'left-1/2', 'transform', '-translate-x-1/2', '-translate-y-1/2', 'z-[2000]', 'max-w-xs');
            alertBox.innerHTML = `<p class="text-gray-800">${message}</p><button onclick="this.parentNode.remove()" class="mt-4 px-4 py-2 bg-villarrica-blue text-white rounded-lg hover:bg-villarrica-blue-dark transition-colors">OK</button>`;
            document.body.appendChild(alertBox);
        }

        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-39.488026856932365,-72.57521476301702],[-38.93965966064718,-71.53962273072693]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            if (tempDiv.querySelector('td img')) {
                popup._contentNode.classList.add('media');
                setTimeout(function() {
                    popup.update();
                }, 10);
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        
        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        
        map.createPane('pane_GoogleSatellite_1');
        map.getPane('pane_GoogleSatellite_1').style.zIndex = 401;
        var layer_GoogleSatellite_1 = L.tileLayer('http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 22
        });

        function pop_Subdivisiones20232024_2(feature, layer) {
            function createDetails(summaryText, contentValue) {
                var displayValue = (contentValue === null || contentValue === '') ? 'Sin información' : String(contentValue).replace(/'/g, '\'').toLocaleString();
                return `<details class="group border-b border-gray-200 pb-2"><summary class="flex justify-between items-center font-medium cursor-pointer text-blue-700 hover:text-blue-800 py-1 transition-colors duration-200"><span>${summaryText}</span><svg class="w-5 h-5 transition-transform duration-200 group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></summary><div class="mt-2 text-sm text-gray-600 pl-4"><p>${autolinker.link(displayValue)}</p></div></details>`;
            }

            var popupContent = '<div class="space-y-3">';
            popupContent += `<div class="flex justify-between items-center py-2 border-b border-gray-200 last:border-b-0"><span class="font-medium text-gray-700">ROL:</span><span class="text-gray-900 font-semibold">${autolinker.link(String(feature.properties['rol'] !== null ? feature.properties['rol'] : 'No disponible'))}</span></div>`;
            popupContent += createDetails('ZONA PRI', feature.properties['ZONA PRI']);
            popupContent += createDetails('ZONA/SECTOR', feature.properties['ZONA']);
            popupContent += createDetails('ZOTT', feature.properties['ZOIT']);
            popupContent += createDetails('ESTADO LAGO', feature.properties['ESTADO LAG']);
            popupContent += createDetails('COMUNIDAD INDÍGENA', feature.properties['COMUNIDAD']);
            popupContent += createDetails('CONSTRUCCIONES', feature.properties['CONSTRUC.']);
            
            var aprobacionValue = (feature.properties['APROBACIÓ'] === null || feature.properties['APROBACIÓ'] === '') ? 'Sin información' : String(feature.properties['APROBACIÓ']);
            popupContent += `<details class="group border-b border-gray-200 pb-2"><summary class="flex justify-between items-center font-medium cursor-pointer text-blue-700 hover:text-blue-800 py-1 transition-colors duration-200"><span>APROBACIÓN PERMISO: ${aprobacionValue}</span><svg class="w-5 h-5 transition-transform duration-200 group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></summary><div class="mt-2 text-sm text-gray-600 pl-4 space-y-2">`;
            popupContent += `<p><span class="font-bold">FECHA:</span> ${autolinker.link(String(feature.properties['FECHA'] !== null ? feature.properties['FECHA'] : 'Sin información'))}</p>`;
            popupContent += `<p><span class="font-bold">UBICACIÓN:</span> ${autolinker.link(String(feature.properties['UBICACIÓN'] !== null ? feature.properties['UBICACIÓN'] : 'Sin información'))}</p>`;
            popupContent += `<p><span class="font-bold">PROPIETARIO:</span> ${autolinker.link(String(feature.properties['PROPIETARI'] !== null ? feature.properties['PROPIETARI'] : 'Sin información'))}</p>`;
            popupContent += `<p><span class="font-bold">SUPERFICIE (MT2):</span> ${autolinker.link(String(feature.properties['SUPERFICIE'] !== null ? feature.properties['SUPERFICIE'] : 'Sin información'))}</p>`;
            popupContent += `<p><span class="font-bold">DESTINO:</span> ${autolinker.link(String(feature.properties['DESTINO'] !== null ? feature.properties['DESTINO'] : 'Sin información'))}</p>`;
            popupContent += `<p><span class="font-bold">RECEPCIÓN:</span> ${autolinker.link(String(feature.properties['RECEPCIÓN'] !== null ? feature.properties['RECEPCIÓN'] : 'Sin información'))}</p>`;
            popupContent += '</div></details></div>';

            return popupContent;
        }

        function style_Subdivisiones20232024_2_0() {
            return {
                pane: 'pane_Subdivisiones20232024_2',
                opacity: 1,
                color: 'rgba(255,1,1,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(232,113,141,0.0)',
                interactive: true,
            }
        }
        
        map.createPane('pane_Subdivisiones20232024_2');
        map.getPane('pane_Subdivisiones20232024_2').style.zIndex = 402;
        map.getPane('pane_Subdivisiones20232024_2').style['mix-blend-mode'] = 'normal';
        var layer_Subdivisiones20232024_2 = new L.geoJson(json_Subdivisiones20232024_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Subdivisiones20232024_2',
            layerName: 'layer_Subdivisiones20232024_2',
            onEachFeature: function(feature, layer) {
                layer.on('click', function() {
                    const rolInfoHtml = pop_Subdivisiones20232024_2(feature, layer);
                    document.getElementById('rol-info-display').innerHTML = rolInfoHtml;
                    cleanUpTemporaryMarkers();
                });
            },
            style: style_Subdivisiones20232024_2_0,
        });
        bounds_group.addLayer(layer_Subdivisiones20232024_2);
        
        // --- Cambios para asegurar que las capas se añadan correctamente ---
        // 1. Añadimos la capa de Google Satellite al mapa de inmediato
        map.addLayer(layer_GoogleSatellite_1);
        // 2. Añadimos la capa de subdivisiones al mapa de inmediato
        map.addLayer(layer_Subdivisiones20232024_2);

        var overlaysTree = [
            {
                label: '<b>Capas de Información</b>',
                children: [
                    {label: '<img src="legend/Subdivisiones20232024_2.png" /> Subdivisiones 2023-2024', layer: layer_Subdivisiones20232024_2},
                ]
            },
            {
                label: '<b>Mapas Base</b>',
                children: [
                    {label: "OpenStreetMap", layer: layer_OpenStreetMap_0, radioGroup: "baseLayers"},
                    {label: "Google Satellite", layer: layer_GoogleSatellite_1, radioGroup: "baseLayers", checked: true},
                ]
            }
        ];

        var lay = L.control.layers.tree(null, overlaysTree, {
            collapsed: true, 
            position: 'topright'
        });
        lay.addTo(map);

        setBounds();

        var coordSearchMarker = null;
        var rolSearchMarker = null;
        
        function cleanUpTemporaryMarkers() {
            if (coordSearchMarker) {
                map.removeLayer(coordSearchMarker);
                coordSearchMarker = null;
            }
            if (rolSearchMarker) {
                map.removeLayer(rolSearchMarker);
                rolSearchMarker = null;
            }
            hideRolSuggestions();
        }
        
        const sidebarRight = document.getElementById('sidebar-right');
        const rolInfoDisplay = document.getElementById('rol-info-display');
        const searchInput = document.getElementById('rolInput');
        const searchBtn = document.getElementById('buscarRol');
        const coordenadasInput = document.getElementById('coordenadasInput');
        const buscarCoordenadasBtn = document.getElementById('buscarCoordenadas');
        const resultadoDiv = document.getElementById('resultadoBusqueda');
        const resultadoRolDiv = document.getElementById('resultadoBusquedaRol');
        const rolSugerenciasDiv = document.getElementById('rolSugerencias');
        
        var MouseCoordinateDisplay = L.Control.extend({
            onAdd: function(map) {
                var container = L.DomUtil.create('div', 'coordinate-display leaflet-control');
                container.id = 'mouseCoordDisplay';
                container.innerHTML = `Lat: --.-- Lon: --.--`;
                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);
                return container;
            },
            onRemove: function(map) {}
        });

        // --- CORRECCIÓN: Agregar el visor de coordenadas al mapa ---
        var mouseCoordinateDisplay = new MouseCoordinateDisplay({position: 'bottomleft'}).addTo(map);
        var mouseCoordDisplayElement = document.getElementById('mouseCoordDisplay');

        map.on('mousemove', function(e) {
            var lat = e.latlng.lat.toFixed(6);
            var lon = e.latlng.lng.toFixed(6);
            if (mouseCoordDisplayElement) {
                mouseCoordDisplayElement.innerHTML = `Lat: ${lat} Lon: ${lon}`;
            }
        });

        map.on('mouseout', function() {
            if (mouseCoordDisplayElement) {
                mouseCoordDisplayElement.innerHTML = `Lat: --.-- Lon: --.--`;
            }
        });
        
        buscarCoordenadasBtn.addEventListener('click', function() {
            cleanUpTemporaryMarkers();
            const inputValue = coordenadasInput.value.trim();
            const parts = inputValue.split(/[,\s]+/);
            resultadoDiv.textContent = '';
            if (parts.length !== 2) {
                resultadoDiv.textContent = 'Formato: Lat, Lon';
                return;
            }
            const lat = parseFloat(parts[0]);
            const lng = parseFloat(parts[1]);
            if (isNaN(lat) || isNaN(lng)) {
                resultadoDiv.textContent = 'Coordenadas inválidas.';
                return;
            }
            map.setView([lat, lng], 15);
            coordSearchMarker = L.marker([lat, lng]).addTo(map);
            const formattedLat = lat.toFixed(6);
            const formattedLng = lng.toFixed(6);
            coordSearchMarker.bindPopup(`<b>Coordenadas:</b><br>${formattedLat}, ${formattedLng}`).openPopup();
            coordSearchMarker.on('popupclose', function() {
                cleanUpTemporaryMarkers();
            });
        });
        
        coordenadasInput.addEventListener('input', function() {
            resultadoDiv.textContent = '';
        });

        var rolIcon = L.divIcon({
            className: 'rol-marker-icon fas fa-map-marker-alt',
            iconSize: [30, 30],
            iconAnchor: [15, 30],
            popupAnchor: [0, -25]
        });

        function hideRolSuggestions() {
            rolSugerenciasDiv.style.display = 'none';
            rolSugerenciasDiv.innerHTML = '';
        }

        rolInput.addEventListener('input', function() {
            resultadoRolDiv.textContent = '';
            const searchTerm = rolInput.value.trim().toLowerCase();
            
            if (searchTerm.length < 1) {
                hideRolSuggestions();
                return;
            }

            const matchingRoles = new Set();
            layer_Subdivisiones20232024_2.eachLayer(function(layer) {
                if (layer.feature && layer.feature.properties && layer.feature.properties['rol'] !== null) {
                    const rol = String(layer.feature.properties['rol']).trim().toLowerCase();
                    if (rol.includes(searchTerm)) {
                        matchingRoles.add(rol);
                    }
                }
            });

            const sortedRoles = Array.from(matchingRoles).sort();

            rolSugerenciasDiv.innerHTML = '';

            if (sortedRoles.length > 0) {
                sortedRoles.slice(0, 10).forEach(rol => {
                    const suggestionItem = document.createElement('div');
                    suggestionItem.classList.add('sugerencia-item');
                    suggestionItem.textContent = rol;
                    suggestionItem.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        rolInput.value = rol;
                        hideRolSuggestions();
                        searchBtn.click();
                    });
                    rolSugerenciasDiv.appendChild(suggestionItem);
                });
                rolSugerenciasDiv.style.display = 'block';
            } else {
                hideRolSuggestions();
            }
        });

        map.on('click', function(e) {
            if (!sidebarRight.contains(e.originalEvent.target)) {
                hideRolSuggestions();
            }
        });

        rolInput.addEventListener('blur', function() {
            setTimeout(() => {
                if (!rolSugerenciasDiv.contains(document.activeElement) && document.activeElement !== rolInput) {
                    hideRolSuggestions();
                }
            }, 100);
        });

        searchBtn.addEventListener('click', function() {
            cleanUpTemporaryMarkers();
            const rolValue = searchInput.value.trim();
            resultadoRolDiv.textContent = '';
            hideRolSuggestions();

            if (!rolValue) {
                resultadoRolDiv.textContent = 'Por favor, ingrese un ROL.';
                return;
            }

            let foundFeature = null;
            layer_Subdivisiones20232024_2.eachLayer(function(layer) {
                if (layer.feature && layer.feature.properties && String(layer.feature.properties['rol']).trim().toLowerCase() === rolValue.toLowerCase()) {
                    foundFeature = layer;
                    return;
                }
            });

            if (foundFeature) {
                const center = foundFeature.getBounds().getCenter();
                map.setView(center, 17);

                rolSearchMarker = L.marker(center, {icon: rolIcon}).addTo(map);

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
            html, body, #map {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }
            /* Estilos para el buscador de coordenadas */
            .coordenadas-buscador.leaflet-control {
                padding: 10px;
                background-color: rgba(255, 255, 255, 0.9);
                border-radius: 5px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.15);
                z-index: 1000;
                width: 250px;
                font-family: Arial, sans-serif;
                color: #333;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
            }

            .coordenadas-buscador span {
                display: none;
            }

            .coordenadas-buscador input {
                width: 100%;
                padding: 8px 12px;
                margin-bottom: 8px;
                border: 1px solid #ccc;
                border-radius: 3px;
                box-sizing: border-box;
                font-size: 0.95em;
                color: #333;
                transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            }

            .coordenadas-buscador input::placeholder {
                color: #999;
                font-size: 0.9em;
            }

            .coordenadas-buscador input:focus {
                border-color: #007bff;
                box-shadow: 0 0 4px rgba(0, 123, 255, 0.4);
                outline: none;
            }

            .coordenadas-buscador button {
                width: 100%;
                padding: 8px 12px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 3px;
                cursor: pointer;
                font-size: 0.95em;
                font-weight: normal;
                transition: background-color 0.2s ease-in-out;
            }

            .coordenadas-buscador button:hover {
                background-color: #0056b3;
            }

            .coordenadas-buscador button:active {
                background-color: #004085;
            }

            #resultadoBusqueda {
                font-size: 0.8em;
                margin-top: 5px;
                color: #dc3545;
                font-weight: normal;
                text-align: center;
                width: 100%;
            }

            /* Estilos para el control de capas (leyenda) */
            .leaflet-control-layers {
                z-index: 1000;
                position: absolute;
                top: 10px;
                right: 10px;
                left: unset;
            }
            .leaflet-control-layers-base span {
                display: none;
            }
            .leaflet-control-layers-expanded .leaflet-control-layers-list {
                display: block;
            }
            .leaflet-control-layers-tree .leaflet-control-layers-separator {
                display: none;
            }

            /* Ajuste para el control de búsqueda (roles) */
            .leaflet-bar.leaflet-control.leaflet-control-search {
                top: 10px;
                right: 280px; /* Ajustado para dejar espacio al buscador de coordenadas */
                position: absolute;
                left: unset;
            }

            /* --- Estilos para los desplegables en el popup (Opción 2) --- */
            .leaflet-popup-content details {
                margin-bottom: 5px; /* Espacio entre los desplegables */
                border: 1px solid #ddd;
                border-radius: 3px;
                background-color: #f9f9f9;
            }

            .leaflet-popup-content summary {
                padding: 8px 10px;
                font-weight: bold;
                cursor: pointer;
                background-color: #eee;
                border-bottom: 1px solid #ddd; /* Separador */
            }

            .leaflet-popup-content details[open] summary {
                background-color: #e0e0e0; /* Fondo cuando está abierto */
            }

            .leaflet-popup-content details p {
                padding: 5px 10px 8px; /* Padding para el contenido dentro del desplegable */
                margin: 0;
                font-size: 0.9em; /* Tamaño de fuente del contenido */
                line-height: 1.4;
            }
            /* Ocultar las tablas internas generadas por qgis2web dentro de los <p> si no las queremos */
            .leaflet-popup-content details p table {
                width: 100%; /* Asegura que la tabla no desborde */
                border-collapse: collapse;
            }
            .leaflet-popup-content details p th,
            .leaflet-popup-content details p td {
                padding: 4px 6px;
                text-align: left;
                border-bottom: 1px solid #eee;
            }
            .leaflet-popup-content details p th {
                font-weight: normal; /* No tan negrita como el summary */
                color: #555;
                width: 100px; /* Ancho fijo para las etiquetas de th */
            }

        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/Subdivisiones20232024_2.js"></script>
        <script>
            var map = L.map('map', {
                zoomControl:false, maxZoom:28, minZoom:1
            }).fitBounds([[-39.488026856932365,-72.57521476301702],[-38.93965966064718,-71.53962273072693]]);
            var hash = new L.Hash(map);
            map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
            var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
            // remove popup's row if "visible-with-data"
            function removeEmptyRowsFromPopupContent(content, feature) {
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                var rows = tempDiv.querySelectorAll('tr');
                for (var i = 0; i < rows.length; i++) {
                    var td = rows[i].querySelector('td.visible-with-data');
                    var key = td ? td.id : '';
                    if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                        rows[i].parentNode.removeChild(rows[i]);
                    }
                }
                return tempDiv.innerHTML;
            }
            // add class to format popup if it contains media
            function addClassToPopupIfMedia(content, popup) {
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                if (tempDiv.querySelector('td img')) {
                    popup._contentNode.classList.add('media');
                        // Delay to force the redraw
                        setTimeout(function() {
                            popup.update();
                        }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            }
            var zoomControl = L.control.zoom({
                position: 'topleft'
            }).addTo(map);
            var bounds_group = new L.featureGroup([]);
            function setBounds() {
            }
            
            // --- Mapas base: se inicializan pero NO se añaden al mapa inmediatamente ---
            map.createPane('pane_OpenStreetMap_0');
            map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
            var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                pane: 'pane_OpenStreetMap_0',
                opacity: 1.0,
                attribution: '',
                minZoom: 1,
                maxZoom: 28,
                minNativeZoom: 0,
                maxNativeZoom: 19
            });
            
            map.createPane('pane_GoogleSatellite_1');
            map.getPane('pane_GoogleSatellite_1').style.zIndex = 401;
            var layer_GoogleSatellite_1 = L.tileLayer('http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                pane: 'pane_GoogleSatellite_1',
                opacity: 1.0,
                attribution: '',
                minZoom: 1,
                maxZoom: 28,
                minNativeZoom: 0,
                maxNativeZoom: 22
            });

            // --- Capa de información (Subdivisiones) ---
            function pop_Subdivisiones20232024_2(feature, layer) {
                // Modificación aquí: Creando el contenido del popup con <details>/<summary>
                var popupContent = '<h4>ROL: ' + (feature.properties['rol'] !== null ? autolinker.link(String(feature.properties['rol']).replace(/'/g, '\'').toLocaleString()) : '') + '</h4>';
                
                // Función auxiliar para crear un desplegable
                function createDetails(summaryText, contentValue) {
                    // Solo crear el desplegable si el valor no es nulo ni vacío
                    if (contentValue === null || contentValue === '') {
                        return '';
                    }
                    return '<details><summary>' + summaryText + '</summary><p>' + autolinker.link(String(contentValue).replace(/'/g, '\'').toLocaleString()) + '</p></details>';
                }

                // Aplicar createDetails a TODAS las propiedades excepto 'rol'
                popupContent += createDetails('ZONA PRI', feature.properties['ZONA PRI']);
                popupContent += createDetails('ZONA/SECTOR', feature.properties['ZONA']);
                popupContent += createDetails('ZOIT', feature.properties['ZOIT']);
                popupContent += createDetails('ESTADO LAGO', feature.properties['ESTADO LAG']);
                popupContent += createDetails('COMUNIDAD INDÍGENA', feature.properties['COMUNIDAD']);
                popupContent += createDetails('CONSTRUCCIONES', feature.properties['CONSTRUC.']);
                popupContent += createDetails('APROBACIÓN', feature.properties['APROBACIÓ']);
                popupContent += createDetails('FECHA', feature.properties['FECHA']);
                popupContent += createDetails('UBICACIÓN', feature.properties['UBICACIÓN']);
                popupContent += createDetails('PROPIETARIO', feature.properties['PROPIETARI']);
                popupContent += createDetails('SUPERFICIE (MT2)', feature.properties['SUPERFICIE']);
                popupContent += createDetails('DESTINO', feature.properties['DESTINO']);
                popupContent += createDetails('RECEPCIÓN', feature.properties['RECEPCIÓN']);
                // Asegúrate de que todas las propiedades que quieras desplegar estén aquí

                var content = removeEmptyRowsFromPopupContent(popupContent, feature);
                layer.on('popupopen', function(e) {
                    addClassToPopupIfMedia(content, e.popup);
                });
                layer.bindPopup(content, { maxHeight: 400 });
            }

            function style_Subdivisiones20232024_2_0() {
                return {
                    pane: 'pane_Subdivisiones20232024_2',
                    opacity: 1,
                    color: 'rgba(255,1,1,1.0)',
                    dashArray: '',
                    lineCap: 'butt',
                    lineJoin: 'miter',
                    weight: 1.0,
                    fill: true,
                    fillOpacity: 1,
                    fillColor: 'rgba(232,113,141,0.0)',
                    interactive: true,
                }
            }
            map.createPane('pane_Subdivisiones20232024_2');
            map.getPane('pane_Subdivisiones20232024_2').style.zIndex = 402;
            map.getPane('pane_Subdivisiones20232024_2').style['mix-blend-mode'] = 'normal';
            var layer_Subdivisiones20232024_2 = new L.geoJson(json_Subdivisiones20232024_2, {
                attribution: '',
                interactive: true,
                dataVar: 'json_Subdivisiones20232024_2',
                layerName: 'layer_Subdivisiones20232024_2',
                pane: 'pane_Subdivisiones20232024_2',
                onEachFeature: pop_Subdivisiones20232024_2,
                style: style_Subdivisiones20232024_2_0,
            });
            bounds_group.addLayer(layer_Subdivisiones20232024_2);
            map.addLayer(layer_Subdivisiones20232024_2);

            // --- Configuración del control de capas (leyenda) ---
            var overlaysTree = [
                {
                    label: '<b>Capas de Información</b>',
                    children: [
                        {label: '<img src="legend/Subdivisiones20232024_2.png" /> Subdivisiones 2023-2024', layer: layer_Subdivisiones20232024_2},
                    ]
                },
                {
                    label: '<b>Mapas Base</b>',
                    children: [
                        {label: "OpenStreetMap", layer: layer_OpenStreetMap_0, radioGroup: "baseLayers"},
                        {label: "Google Satellite", layer: layer_GoogleSatellite_1, radioGroup: "baseLayers", checked: true},
                    ]
                }
            ];

            var lay = L.control.layers.tree(null, overlaysTree, {
                collapsed: false,
                position: 'topright'
            });
            lay.addTo(map);

            map.addLayer(layer_GoogleSatellite_1);

            setBounds();

            var coordSearchMarker = null;

            function cleanUpTemporaryMarkers() {
                if (coordSearchMarker) {
                    map.removeLayer(coordSearchMarker);
                    coordSearchMarker = null;
                }
                layer_Subdivisiones20232024_2.eachLayer(function(layer) {
                    if (layer.isPopupOpen()) {
                        layer.closePopup();
                    }
                });
                map.off('click', cleanUpTemporaryMarkers);
            }

            var CoordsSearchControl = L.Control.extend({
                onAdd: function(map) {
                    var container = L.DomUtil.create('div', 'coordenadas-buscador leaflet-control');
                    container.innerHTML = `
                        <input type="text" id="coordenadasInput" placeholder="Lat, Lon (ej: -39.28 -72.24)">
                        <button id="buscarCoordenadas">Buscar</button>
                        <div id="resultadoBusqueda"></div>
                    `;

                    L.DomEvent.disableClickPropagation(container);
                    L.DomEvent.disableScrollPropagation(container);

                    return container;
                },
                onRemove: function(map) { }
            });

            var coordsSearchControlInstance = new CoordsSearchControl({position: 'topright'}).addTo(map);

            const coordenadasInput = coordsSearchControlInstance.getContainer().querySelector('#coordenadasInput');
            const buscarBoton = coordsSearchControlInstance.getContainer().querySelector('#buscarCoordenadas');
            const resultadoDiv = coordsSearchControlInstance.getContainer().querySelector('#resultadoBusqueda');

            setTimeout(function() {
                const legendControl = document.querySelector('.leaflet-control-layers');
                const coordSearchControlElement = coordsSearchControlInstance.getContainer();

                if (legendControl && coordSearchControlElement) {
                    const legendRect = legendControl.getBoundingClientRect();
                    const mapRect = map.getContainer().getBoundingClientRect();
                    
                    coordSearchControlElement.style.top = (legendRect.bottom - mapRect.top + 20) + 'px';
                    coordSearchControlElement.style.right = '10px';
                }
            }, 500);

            var searchControl = new L.Control.Search({
                layer: layer_Subdivisiones20232024_2,
                initial: false,
                hideMarkerOnCollapse: true,
                propertyName: 'rol',
                textPlaceholder: 'Buscar ROL...',
                collapsed: true
            });
            map.addControl(searchControl);

            map.on('search:locationfound', function(e) {
                cleanUpTemporaryMarkers();

                var layerFound = e.layer;
                
                map.fitBounds(layerFound.getBounds());
                
                layerFound.openPopup();

                map.on('click', cleanUpTemporaryMarkers);
                layerFound.on('popupclose', function() {
                    cleanUpTemporaryMarkers();
                });
            });

            map.on('search:collapsed', function(e) {
                cleanUpTemporaryMarkers();
            });

            document.querySelectorAll('.leaflet-control-search .search-button').forEach(button => {
                if (!button.classList.contains('fa-binoculars')) {
                    button.classList.add('fa', 'fa-binoculars');
                }
            });

            resetLabels([layer_Subdivisiones20232024_2]);
            map.on("zoomend", function(){
                resetLabels([layer_Subdivisiones20232024_2]);
            });
            map.on("layeradd", function(){
                resetLabels([layer_Subdivisiones20232024_2]);
            });
            map.on("layerremove", function(){
                resetLabels([layer_Subdivisiones20232024_2]);
            });

            buscarBoton.addEventListener('click', function() {
                cleanUpTemporaryMarkers();

                const inputValue = coordenadasInput.value.trim();
                const parts = inputValue.split(/\s+/);

                resultadoDiv.textContent = '';

                if (parts.length !== 2) {
                    resultadoDiv.textContent = 'Formato: Lat, Lon';
                    return;
                }

                const lat = parseFloat(parts[0]);
                const lng = parseFloat(parts[1]);

                if (isNaN(lat) || isNaN(lng)) {
                    resultadoDiv.textContent = 'Coordenadas inválidas.';
                    return;
                }

                map.setView([lat, lng], 15);

                coordSearchMarker = L.marker([lat, lng]).addTo(map);
                const formattedLat = lat.toFixed(4);
                const formattedLng = lng.toFixed(4);
                coordSearchMarker.bindPopup(`<b>Coordenadas:</b><br>${formattedLat}, ${formattedLng}`).openPopup();

                map.on('click', cleanUpTemporaryMarkers);
                coordSearchMarker.on('popupclose', function() {
                    cleanUpTemporaryMarkers();
                });
            });

            coordenadasInput.addEventListener('input', function() {
                resultadoDiv.textContent = '';
            });
        </script>
    </body>
</html>

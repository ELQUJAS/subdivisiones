<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
            html, body, #map {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }
            /* Estilos minimalistas para el buscador de coordenadas */
            .coordenadas-buscador {
                padding: 8px;
                background-color: rgba(255, 255, 255, 0.9);
                border-radius: 5px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.15);
                position: absolute; /* Importante para el posicionamiento manual */
                z-index: 1000;
                width: 220px;
                font-family: Arial, sans-serif;
                color: #333;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                /* Eliminamos el margin-top aquí y lo manejamos con 'top' en el script para apilar */
            }

            .coordenadas-buscador span {
                display: none;
            }

            .coordenadas-buscador input {
                flex-grow: 1;
                padding: 6px 10px;
                margin-right: 5px;
                border: 1px solid #ccc;
                border-radius: 3px;
                box-sizing: border-box;
                font-size: 0.85em;
                color: #333;
                transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            }

            .coordenadas-buscador input::placeholder {
                color: #999;
                font-size: 0.9em;
            }

            .coordenadas-buscador input:focus {
                border-color: #007bff;
                box-shadow: 0 0 4px rgba(0, 123, 255, 0.4);
                outline: none;
            }

            .coordenadas-buscador button {
                padding: 6px 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 3px;
                cursor: pointer;
                font-size: 0.85em;
                font-weight: normal;
                transition: background-color 0.2s ease-in-out;
            }

            .coordenadas-buscador button:hover {
                background-color: #0056b3;
            }

            .coordenadas-buscador button:active {
                background-color: #004085;
            }

            #resultadoBusqueda {
                font-size: 0.75em;
                margin-top: 5px;
                color: #dc3545;
                font-weight: normal;
                position: absolute;
                width: calc(100% - 16px);
                bottom: -20px;
                left: 8px;
                text-align: center;
            }

            /* Estilos para el control de capas (leyenda) */
            .leaflet-control-layers {
                z-index: 1000;
                position: absolute; /* Asegura el posicionamiento manual */
                top: 10px; /* Posiciona en la parte superior derecha (valor por defecto de qgis2web) */
                right: 10px;
                left: unset; /* Deshacer cualquier estilo de left */
            }
            .leaflet-control-layers-base span {
                display: none;
            }
            .leaflet-control-layers-expanded .leaflet-control-layers-list {
                display: block;
            }
            .leaflet-control-layers-tree .leaflet-control-layers-separator {
                display: none;
            }

            /* Ajuste para el control de búsqueda (roles) */
            .leaflet-bar.leaflet-control.leaflet-control-search {
                top: 10px; /* Posiciona el buscador de roles en la esquina superior derecha */
                right: 250px; /* Ajusta este valor para que no choque con la leyenda */
                position: absolute;
                left: unset;
            }

        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>

        <div id="coordenadasBuscadorControl" class="coordenadas-buscador leaflet-control">
            <input type="text" id="coordenadasInput" placeholder="Lat, Lon (ej: -39.28 -72.24)">
            <button id="buscarCoordenadas">Buscar</button>
            <div id="resultadoBusqueda"></div>
        </div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/Subdivisiones20232024_2.js"></script>
        <script>
            var map = L.map('map', {
                zoomControl:false, maxZoom:28, minZoom:1
            }).fitBounds([[-39.488026856932365,-72.57521476301702],[-38.93965966064718,-71.53962273072693]]);
            var hash = new L.Hash(map);
            map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
            var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
            // remove popup's row if "visible-with-data"
            function removeEmptyRowsFromPopupContent(content, feature) {
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                var rows = tempDiv.querySelectorAll('tr');
                for (var i = 0; i < rows.length; i++) {
                    var td = rows[i].querySelector('td.visible-with-data');
                    var key = td ? td.id : '';
                    if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                        rows[i].parentNode.removeChild(rows[i]);
                    }
                }
                return tempDiv.innerHTML;
            }
            // add class to format popup if it contains media
            function addClassToPopupIfMedia(content, popup) {
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                if (tempDiv.querySelector('td img')) {
                    popup._contentNode.classList.add('media');
                        // Delay to force the redraw
                        setTimeout(function() {
                            popup.update();
                        }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            }
            var zoomControl = L.control.zoom({
                position: 'topleft'
            }).addTo(map);
            var bounds_group = new L.featureGroup([]);
            function setBounds() {
            }
            
            // --- Mapas base: se inicializan pero NO se añaden al mapa inmediatamente ---
            map.createPane('pane_OpenStreetMap_0');
            map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
            var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                pane: 'pane_OpenStreetMap_0',
                opacity: 1.0,
                attribution: '',
                minZoom: 1,
                maxZoom: 28,
                minNativeZoom: 0,
                maxNativeZoom: 19
            });
            
            map.createPane('pane_GoogleSatellite_1');
            map.getPane('pane_GoogleSatellite_1').style.zIndex = 401;
            var layer_GoogleSatellite_1 = L.tileLayer('http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                pane: 'pane_GoogleSatellite_1',
                opacity: 1.0,
                attribution: '',
                minZoom: 1,
                maxZoom: 28,
                minNativeZoom: 0,
                maxNativeZoom: 22
            });

            // --- Capa de información (Subdivisiones) ---
            function pop_Subdivisiones20232024_2(feature, layer) {
                var popupContent = '<table>\
                            <tr>\
                                <th scope="row">ROL : </th>\
                                <td>' + (feature.properties['rol'] !== null ? autolinker.link(String(feature.properties['rol']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">ZONA PRI : </th>\
                                <td>' + (feature.properties['ZONA PRI'] !== null ? autolinker.link(String(feature.properties['ZONA PRI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">ZONA/SECTOR : </th>\
                                <td>' + (feature.properties['ZONA'] !== null ? autolinker.link(String(feature.properties['ZONA']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">ZOIT : </th>\
                                <td>' + (feature.properties['ZOIT'] !== null ? autolinker.link(String(feature.properties['ZOIT']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">ESTADO LAGO : </th>\
                                <td>' + (feature.properties['ESTADO LAG'] !== null ? autolinker.link(String(feature.properties['ESTADO LAG']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">COMUNIDAD INDÍGENA : </th>\
                                <td>' + (feature.properties['COMUNIDAD'] !== null ? autolinker.link(String(feature.properties['COMUNIDAD']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">CONSTRUCCIONES : </th>\
                                <td>' + (feature.properties['CONSTRUC.'] !== null ? autolinker.link(String(feature.properties['CONSTRUC.']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">APROBACIÓN : </th>\
                                <td>' + (feature.properties['APROBACIÓ'] !== null ? autolinker.link(String(feature.properties['APROBACIÓ']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">FECHA : </th>\
                                <td>' + (feature.properties['FECHA'] !== null ? autolinker.link(String(feature.properties['FECHA']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">UBICACIÓN : </th>\
                                <td>' + (feature.properties['UBICACIÓN'] !== null ? autolinker.link(String(feature.properties['UBICACIÓN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">PROPIETARIO : </th>\
                                <td>' + (feature.properties['PROPIETARI'] !== null ? autolinker.link(String(feature.properties['PROPIETARI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">SUPERFICIE (MT2) : </th>\
                                <td>' + (feature.properties['SUPERFICIE'] !== null ? autolinker.link(String(feature.properties['SUPERFICIE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">DESTINO : </th>\
                                <td>' + (feature.properties['DESTINO'] !== null ? autolinker.link(String(feature.properties['DESTINO']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">RECEPCIÓN : </th>\
                                <td>' + (feature.properties['RECEPCIÓN'] !== null ? autolinker.link(String(feature.properties['RECEPCIÓN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                        </table>';
                var content = removeEmptyRowsFromPopupContent(popupContent, feature);
                layer.on('popupopen', function(e) {
                    addClassToPopupIfMedia(content, e.popup);
                });
                layer.bindPopup(content, { maxHeight: 400 });
            }

            function style_Subdivisiones20232024_2_0() {
                return {
                    pane: 'pane_Subdivisiones20232024_2',
                    opacity: 1,
                    color: 'rgba(255,1,1,1.0)',
                    dashArray: '',
                    lineCap: 'butt',
                    lineJoin: 'miter',
                    weight: 1.0,
                    fill: true,
                    fillOpacity: 1,
                    fillColor: 'rgba(232,113,141,0.0)',
                    interactive: true,
                }
            }
            map.createPane('pane_Subdivisiones20232024_2');
            map.getPane('pane_Subdivisiones20232024_2').style.zIndex = 402;
            map.getPane('pane_Subdivisiones20232024_2').style['mix-blend-mode'] = 'normal';
            var layer_Subdivisiones20232024_2 = new L.geoJson(json_Subdivisiones20232024_2, {
                attribution: '',
                interactive: true,
                dataVar: 'json_Subdivisiones20232024_2',
                layerName: 'layer_Subdivisiones20232024_2',
                pane: 'pane_Subdivisiones20232024_2',
                onEachFeature: pop_Subdivisiones20232024_2,
                style: style_Subdivisiones20232024_2_0,
            });
            bounds_group.addLayer(layer_Subdivisiones20232024_2);
            map.addLayer(layer_Subdivisiones20232024_2);

            // --- Configuración del control de capas (leyenda) ---
            var overlaysTree = [
                {
                    label: '<b>Capas de Información</b>',
                    children: [
                        {label: '<img src="legend/Subdivisiones20232024_2.png" /> Subdivisiones 2023-2024', layer: layer_Subdivisiones20232024_2},
                    ]
                },
                {
                    label: '<b>Mapas Base</b>',
                    children: [
                        {label: "OpenStreetMap", layer: layer_OpenStreetMap_0, radioGroup: "baseLayers"},
                        {label: "Google Satellite", layer: layer_GoogleSatellite_1, radioGroup: "baseLayers", checked: true},
                    ]
                }
            ];

            var lay = L.control.layers.tree(null, overlaysTree, {
                collapsed: false, // Leyenda fija
                position: 'topright' // Vuelve a la esquina superior derecha
            });
            lay.addTo(map);

            // Asegúrate de añadir el mapa base por defecto al mapa
            map.addLayer(layer_GoogleSatellite_1);

            setBounds();

            // Variables globales para almacenar los marcadores temporales
            var coordSearchMarker = null;
            var rolSearchMarker = null;

            // Función para limpiar cualquier marcador temporal activo
            function cleanUpTemporaryMarkers() {
                if (coordSearchMarker) {
                    map.removeLayer(coordSearchMarker);
                    coordSearchMarker = null;
                }
                if (rolSearchMarker) {
                    map.removeLayer(rolSearchMarker);
                    rolSearchMarker = null;
                }
                if (!coordSearchMarker && !rolSearchMarker) {
                    map.off('click', cleanUpTemporaryMarkers);
                }
            }

            // --- Posicionamiento y manejo del buscador de coordenadas ---
            // Obtenemos una referencia al div del buscador de coordenadas
            const coordenadasBuscadorDiv = document.getElementById('coordenadasBuscadorControl');

            // Calculamos la posición inicial. La leyenda está en 'topright'.
            // Necesitamos el ancho y alto de la leyenda para posicionar el buscador debajo.
            // Esto es un poco dinámico, por lo que una estimación inicial o un Listener podría ser útil.
            // Para simplificar, le daremos un 'top' que asuma un tamaño promedio de la leyenda.
            // Si la leyenda es muy grande o muy pequeña, esto podría necesitar ajuste.
            function positionCoordenadasBuscador() {
                const legendControl = document.querySelector('.leaflet-control-layers.leaflet-control-layers-expanded');
                if (legendControl) {
                    const legendHeight = legendControl.offsetHeight;
                    coordenadasBuscadorDiv.style.top = (legendHeight + 20) + 'px'; // 20px de margen
                    coordenadasBuscadorDiv.style.right = '10px'; // Misma derecha que la leyenda
                } else {
                     // Fallback si la leyenda no está visible o no se ha renderizado aún
                     coordenadasBuscadorDiv.style.top = '150px'; // Valor de reserva
                     coordenadasBuscadorDiv.style.right = '10px';
                }
            }

            // Llamar al posicionamiento inicial y cada vez que el mapa cambie de tamaño (si la leyenda es dinámica)
            positionCoordenadasBuscador();
            map.on('resize', positionCoordenadasBuscador); // Reajusta si el mapa cambia de tamaño

            // --- Configuración del control de búsqueda de roles ---
            var searchControl = new L.Control.Search({
                layer: layer_Subdivisiones20232024_2,
                initial: false,
                hideMarkerOnCollapse: true,
                propertyName: 'rol',
                marker: {
                    // Podemos dejar este vacío, ya que el 'search:locationfound' manejará el marcador
                }
            });
            map.addControl(searchControl);

            // Listener para cuando se encuentra una ubicación por Rol
            map.on('search:locationfound', function(e) {
                cleanUpTemporaryMarkers();

                var latlng = e.latlng;
                var feature = e.layer.feature; // Obtiene la característica completa
                var layer = e.layer; // Obtiene la capa GeoJSON encontrada

                rolSearchMarker = L.marker(latlng).addTo(map);

                // Obtener el contenido del popup de la capa original y pasarlo al marcador temporal
                // pop_Subdivisiones20232024_2 vincula el popup, necesitamos su contenido para el marcador.
                // Una forma es generar el contenido directamente para el marcador.
                var popupContent = '<table>\
                            <tr>\
                                <th scope="row">ROL : </th>\
                                <td>' + (feature.properties['rol'] !== null ? autolinker.link(String(feature.properties['rol']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">ZONA PRI : </th>\
                                <td>' + (feature.properties['ZONA PRI'] !== null ? autolinker.link(String(feature.properties['ZONA PRI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">ZONA/SECTOR : </th>\
                                <td>' + (feature.properties['ZONA'] !== null ? autolinker.link(String(feature.properties['ZONA']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">ZOIT : </th>\
                                <td>' + (feature.properties['ZOIT'] !== null ? autolinker.link(String(feature.properties['ZOIT']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">ESTADO LAGO : </th>\
                                <td>' + (feature.properties['ESTADO LAG'] !== null ? autolinker.link(String(feature.properties['ESTADO LAG']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">COMUNIDAD INDÍGENA : </th>\
                                <td>' + (feature.properties['COMUNIDAD'] !== null ? autolinker.link(String(feature.properties['COMUNIDAD']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">CONSTRUCCIONES : </th>\
                                <td>' + (feature.properties['CONSTRUC.'] !== null ? autolinker.link(String(feature.properties['CONSTRUC.']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">APROBACIÓN : </th>\
                                <td>' + (feature.properties['APROBACIÓ'] !== null ? autolinker.link(String(feature.properties['APROBACIÓ']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">FECHA : </th>\
                                <td>' + (feature.properties['FECHA'] !== null ? autolinker.link(String(feature.properties['FECHA']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">UBICACIÓN : </th>\
                                <td>' + (feature.properties['UBICACIÓN'] !== null ? autolinker.link(String(feature.properties['UBICACIÓN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">PROPIETARIO : </th>\
                                <td>' + (feature.properties['PROPIETARI'] !== null ? autolinker.link(String(feature.properties['PROPIETARI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">SUPERFICIE (MT2) : </th>\
                                <td>' + (feature.properties['SUPERFICIE'] !== null ? autolinker.link(String(feature.properties['SUPERFICIE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">DESTINO : </th>\
                                <td>' + (feature.properties['DESTINO'] !== null ? autolinker.link(String(feature.properties['DESTINO']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                            <tr>\
                                <th scope="row">RECEPCIÓN : </th>\
                                <td>' + (feature.properties['RECEPCIÓN'] !== null ? autolinker.link(String(feature.properties['RECEPCIÓN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                            </tr>\
                        </table>';
                var content = removeEmptyRowsFromPopupContent(popupContent, feature);
                rolSearchMarker.bindPopup(content, { maxHeight: 400 });
                rolSearchMarker.openPopup();

                map.setView(latlng, 17);

                map.on('click', cleanUpTemporaryMarkers);
                rolSearchMarker.on('popupclose', function() {
                    cleanUpTemporaryMarkers();
                });
            });

            map.on('search:collapsed', function(e) { });

            if (typeof url === 'undefined') {
                document.getElementsByClassName('search-button')[0].className += ' fa fa-binoculars';
            } else {
                document.getElementsByClassName('search-button')[1].className += ' fa fa-binoculars';
            }
            resetLabels([layer_Subdivisiones20232024_2]);
            map.on("zoomend", function(){
                resetLabels([layer_Subdivisiones20232024_2]);
            });
            map.on("layeradd", function(){
                resetLabels([layer_Subdivisiones20232024_2]);
            });
            map.on("layerremove", function(){
                resetLabels([layer_Subdivisiones20232024_2]);
            });

            // JavaScript para la funcionalidad del buscador de coordenadas
            document.addEventListener('DOMContentLoaded', function() {
                const coordenadasInput = document.getElementById('coordenadasInput');
                const buscarBoton = document.getElementById('buscarCoordenadas');
                const resultadoDiv = document.getElementById('resultadoBusqueda');

                buscarBoton.addEventListener('click', function() {
                    cleanUpTemporaryMarkers();

                    const inputValue = coordenadasInput.value.trim();
                    const parts = inputValue.split(/\s+/);

                    resultadoDiv.textContent = '';

                    if (parts.length !== 2) {
                        resultadoDiv.textContent = 'Formato: Lat, Lon';
                        return;
                    }

                    const lat = parseFloat(parts[0]);
                    const lng = parseFloat(parts[1]);

                    if (isNaN(lat) || isNaN(lng)) {
                        resultadoDiv.textContent = 'Coordenadas inválidas.';
                        return;
                    }

                    map.setView([lat, lng], 15);

                    coordSearchMarker = L.marker([lat, lng]).addTo(map);
                    const formattedLat = lat.toFixed(4);
                    const formattedLng = lng.toFixed(4);
                    coordSearchMarker.bindPopup(`<b>Coordenadas:</b><br>${formattedLat}, ${formattedLng}`).openPopup();

                    map.on('click', cleanUpTemporaryMarkers);
                    coordSearchMarker.on('popupclose', function() {
                        cleanUpTemporaryMarkers();
                    });
                });

                coordenadasInput.addEventListener('input', function() {
                    resultadoDiv.textContent = '';
                });
            });
        </script>
    </body>
</html>

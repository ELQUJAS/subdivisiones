<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-app-capable" content="yes">
    
    <!-- Enlaces a las librerías de estilos CSS de Leaflet y plugins -->
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    
    <style>
        /* Estilos generales de la página, asegurando que el mapa y el body ocupen el 100% */
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            overflow: hidden; /* Evita el scroll global */
            background-color: #f0f0f0; /* Fondo general para que coincida */
        }

        /* Contenedor principal que se adapta a la pantalla */
        #main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        /* Estilo para el encabezado superior */
        #header {
            background-color: #0d47a1; /* Color azul del encabezado */
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1001;
            justify-content: flex-start; /* Alinear elementos a la izquierda */
        }
        
        #header .header-buttons {
            margin-left: auto; /* Mueve los botones a la derecha */
            display: flex;
        }

        #header img {
            height: 50px; /* Ajusta el tamaño del logo */
            margin-right: 20px;
        }

        #header h1 {
            font-size: 1.5em;
            margin: 0;
        }
        
        #header .header-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 10px;
            cursor: pointer;
            color: white;
            font-size: 0.8em;
            text-align: center;
            transition: opacity 0.2s ease;
        }
        
        #header .header-button:hover {
            opacity: 0.7;
        }
        
        #header .header-button i {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        /* Contenedor del mapa y el menú, que ocupará el espacio restante */
        #content-container {
            display: flex;
            flex-grow: 1; /* Permite que este contenedor llene el espacio vertical */
            position: relative;
        }

        /* Estilos para el menú lateral derecho */
        #sidebar-right {
            position: relative;
            width: 400px; /* Ancho ajustado para que el menú sea más grande */
            height: 100%;
            background-color: #ffffff;
            border-left: 1px solid #ccc;
            box-shadow: -2px 0 8px rgba(0,0,0,0.15);
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto; /* Agregada la barra de desplazamiento */
            display: flex;
            flex-direction: column;
        }
        
        #sidebar-right h3 {
            font-size: 1.2em;
            margin: 0;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }
        
        #sidebar-right h4 {
             font-size: 1em;
             margin-top: 20px;
             margin-bottom: 10px;
             color: #333;
        }

        /* Contenedor del mapa */
        #map {
            flex-grow: 1;
            position: relative;
            background-color: #f7f7f7; /* Fondo del mapa para que se asemeje a la imagen */
            width: calc(100% - 400px); /* Ajuste del ancho del mapa */
        }
        
        #map .leaflet-container {
             background-color: transparent !important;
        }
        
        /* Estilo para el texto de 'MAPA DE VILLARRICA' en el mapa */
        #map-overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            color: #888;
            font-weight: bold;
            pointer-events: none; /* Asegura que no bloquee los clics en el mapa */
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 10px;
            border-radius: 5px;
        }


        /* Estilos para los campos de búsqueda en el nuevo menú */
        .search-field-group {
            margin-bottom: 15px;
        }
        
        .search-field-group label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }

        .search-field-group input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9em;
        }

        .search-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-buttons button {
            flex-grow: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .search-buttons .buscar-btn {
            background-color: #007bff;
        }
        .search-buttons .buscar-btn:hover {
            background-color: #0056b3;
        }
        
        .search-buttons .ocultar-btn {
            background-color: #dc3545;
        }
        .search-buttons .ocultar-btn:hover {
            background-color: #c82333;
        }
        
        #rol-info-display details {
            margin-bottom: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background-color: #f9f9f9;
        }

        #rol-info-display summary {
            padding: 8px 10px;
            font-weight: bold;
            cursor: pointer;
            background-color: #eee;
            border-bottom: 1px solid #ddd;
        }

        #rol-info-display details[open] summary {
            background-color: #e0e0e0;
        }

        #rol-info-display details p {
            padding: 5px 10px 8px;
            margin: 0;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        /* Estilos del control de zoom */
        .leaflet-control-zoom {
            position: absolute;
            top: 10px;
            left: 10px; /* Posicionado dentro del mapa, arriba a la izquierda */
        }
        
        /* Estilos para el visualizador de coordenadas (solo Lat/Lon) */
        .coordinate-display.leaflet-control {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            color: #333;
            min-width: 180px;
            text-align: center;
            z-index: 1000;
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: unset;
        }
        
        /* Estilo del control de capas */
        .leaflet-control-layers {
            position: absolute;
            top: 10px;
            right: 410px; /* Posicionado a la izquierda del menú lateral */
        }

        /* Estilos para el marcador personalizado del ROL */
        .rol-marker-icon {
            background: none;
            border: none;
            box-shadow: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #ff0000;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            opacity: 0.9;
        }
        
        /* Estilos para el contenedor de sugerencias del buscador de ROL */
        #rolSugerencias {
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-top: none;
            background-color: white;
            box-sizing: border-box;
            position: absolute; 
            z-index: 1001;
            display: none;
            top: 195px; /* Ajuste para que aparezca debajo del input de búsqueda */
        }

        #rolSugerencias .sugerencia-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
            color: #555;
        }

        #rolSugerencias .sugerencia-item:last-child {
            border-bottom: none;
        }

        #rolSugerencias .sugerencia-item:hover {
            background-color: #f0f0f0;
        }
        
        /* Estilos del mensaje de alerta personalizado */
        .custom-alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 2000;
            text-align: center;
            max-width: 300px;
        }
        
        .custom-alert button {
            margin-top: 15px;
            padding: 8px 16px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    <title>Mapa Web de Villarrica</title>
</head>
<body>
    <div id="main-container">
        <!-- Nuevo encabezado superior -->
        <div id="header">
            <img src="color_sin_fondo.png" alt="Logo Villarrica">
            <h1>INFORMACIÓN TERRITORIAL DE LA COMUNA DE VILLARRICA</h1>
            <div class="header-buttons">
                <div class="header-button">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </div>
                <div class="header-button">
                    <i class="fas fa-search"></i>
                    <span>Buscar Rol</span>
                </div>
            </div>
        </div>
        <!-- Contenedor para el mapa y el menú lateral -->
        <div id="content-container">
            <!-- Contenedor del mapa -->
            <div id="map">
                <div id="map-overlay-text">MAPA DE VILLARRICA</div>
            </div>
            <!-- Nuevo menú lateral derecho -->
            <div id="sidebar-right">
                <h3>Buscadores</h3>
                <div class="search-field-group">
                    <label for="coordenadasInput">Latitud, Longitud (ej: -39.28, -72.24)</label>
                    <input type="text" id="coordenadasInput" placeholder="Latitud, Longitud">
                </div>
                <div class="search-buttons">
                    <button class="buscar-btn" id="buscarCoordenadas">Buscar</button>
                </div>
                <div id="resultadoBusqueda"></div>

                <div class="search-field-group">
                    <label for="rolInput">Buscar ROL (ej: 1234-5)</label>
                    <input type="text" id="rolInput" placeholder="Buscar ROL">
                </div>
                <div class="search-buttons">
                    <button class="buscar-btn" id="buscarRol">Buscar ROL</button>
                </div>
                <div id="resultadoBusquedaRol"></div>
                <div id="rolSugerencias"></div>

                <h4>Información de ROL</h4>
                <div id="rol-info-display">
                    <p>Aquí se mostrará la información del ROL buscado.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Enlaces a las librerías de JavaScript -->
    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    
    <!-- Archivo de datos GeoJSON de la capa de subdivisiones -->
    <script src="data/Subdivisiones20232024_2.js"></script>

    <script>
        // Función para mostrar un mensaje de alerta personalizado
        function customAlert(message) {
            const alertBox = document.createElement('div');
            alertBox.classList.add('custom-alert');
            alertBox.innerHTML = `<p>${message}</p><button onclick="this.parentNode.remove()">OK</button>`;
            document.body.appendChild(alertBox);
        }

        // Inicialización del mapa Leaflet
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-39.488026856932365,-72.57521476301702],[-38.93965966064718,-71.53962273072693]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        // Función auxiliar para eliminar filas vacías de un popup
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        // Función auxiliar para añadir una clase a un popup si contiene elementos multimedia
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            if (tempDiv.querySelector('td img')) {
                popup._contentNode.classList.add('media');
                setTimeout(function() {
                    popup.update();
                }, 10);
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        
        // --- Mapas base: se inicializan pero NO se añaden al mapa inmediatamente ---
        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        
        map.createPane('pane_GoogleSatellite_1');
        map.getPane('pane_GoogleSatellite_1').style.zIndex = 401;
        var layer_GoogleSatellite_1 = L.tileLayer('http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 22
        });

        // --- Capa de información (Subdivisiones) ---
        function pop_Subdivisiones20232024_2(feature, layer) {
            // Función para crear un desplegable individual
            function createDetails(summaryText, contentValue) {
                var displayValue = (contentValue === null || contentValue === '') ? 'Sin información' : autolinker.link(String(contentValue).replace(/'/g, '\'').toLocaleString());
                return '<details><summary>' + summaryText + '</summary><p>' + displayValue + '</p></details>';
            }

            var popupContent = '<h4>ROL: ' + (feature.properties['rol'] !== null ? autolinker.link(String(feature.properties['rol']).replace(/'/g, '\'').toLocaleString()) : 'No disponible') + '</h4>';
            popupContent += createDetails('ZONA PRI', feature.properties['ZONA PRI']);
            popupContent += createDetails('ZONA/SECTOR', feature.properties['ZONA']);
            popupContent += createDetails('ZOIT', feature.properties['ZOIT']);
            popupContent += createDetails('ESTADO LAGO', feature.properties['ESTADO LAG']);
            popupContent += createDetails('COMUNIDAD INDÍGENA', feature.properties['COMUNIDAD']);
            popupContent += createDetails('CONSTRUCCIONES', feature.properties['CONSTRUC.']);
            
            // Bloque para la estructura anidada de APROBACIÓN PERMISO
            var aprobacionValue = (feature.properties['APROBACIÓ'] === null || feature.properties['APROBACIÓ'] === '') ? 'Sin información' : autolinker.link(String(feature.properties['APROBACIÓ']).replace(/'/g, '\'').toLocaleString());
            popupContent += `<details><summary>APROBACIÓN PERMISO: ${aprobacionValue}</summary><div style="padding-left: 15px;">`;
            
            popupContent += createDetails('FECHA', feature.properties['FECHA']);
            popupContent += createDetails('UBICACIÓN', feature.properties['UBICACIÓN']);
            popupContent += createDetails('PROPIETARIO', feature.properties['PROPIETARI']);
            popupContent += createDetails('SUPERFICIE (MT2)', feature.properties['SUPERFICIE']);
            popupContent += createDetails('DESTINO', feature.properties['DESTINO']);
            popupContent += createDetails('RECEPCIÓN', feature.properties['RECEPCIÓN']);

            popupContent += '</div></details>';

            var contentDiv = document.createElement('div');
            contentDiv.innerHTML = popupContent; 
            return removeEmptyRowsFromPopupContent(contentDiv.innerHTML, feature);
        }

        function style_Subdivisiones20232024_2_0() {
            return {
                pane: 'pane_Subdivisiones20232024_2',
                opacity: 1,
                color: 'rgba(255,1,1,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(232,113,141,0.0)',
                interactive: true,
            }
        }
        
        map.createPane('pane_Subdivisiones20232024_2');
        map.getPane('pane_Subdivisiones20232024_2').style.zIndex = 402;
        map.getPane('pane_Subdivisiones20232024_2').style['mix-blend-mode'] = 'normal';
        var layer_Subdivisiones20232024_2 = new L.geoJson(json_Subdivisiones20232024_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Subdivisiones20232024_2',
            layerName: 'layer_Subdivisiones20232024_2',
            onEachFeature: function(feature, layer) {
                layer.bindPopup(function(layer) {
                    return pop_Subdivisiones20232024_2(feature, layer);
                }, { maxHeight: 400 });
                layer.on('popupopen', function(e) {
                     addClassToPopupIfMedia(pop_Subdivisiones20232024_2(feature, layer), e.popup);
                });
                // Clic en la capa para mostrar info en el menú lateral
                layer.on('click', function() {
                    const rolInfoHtml = pop_Subdivisiones20232024_2(feature, layer);
                    document.getElementById('rol-info-display').innerHTML = rolInfoHtml;
                    cleanUpTemporaryMarkers();
                });
            },
            style: style_Subdivisiones20232024_2_0,
        });
        bounds_group.addLayer(layer_Subdivisiones20232024_2);
        map.addLayer(layer_Subdivisiones20232024_2);

        // --- Configuración del control de capas (leyenda) ---
        var overlaysTree = [
            {
                label: '<b>Capas de Información</b>',
                children: [
                    {label: '<img src="legend/Subdivisiones20232024_2.png" /> Subdivisiones 2023-2024', layer: layer_Subdivisiones20232024_2},
                ]
            },
            {
                label: '<b>Mapas Base</b>',
                children: [
                    {label: "OpenStreetMap", layer: layer_OpenStreetMap_0, radioGroup: "baseLayers"},
                    {label: "Google Satellite", layer: layer_GoogleSatellite_1, radioGroup: "baseLayers", checked: true},
                ]
            }
        ];

        var lay = L.control.layers.tree(null, overlaysTree, {
            collapsed: true, 
            position: 'topright' // Esta es la posición general, el CSS la moverá a la izquierda del menú
        });
        lay.addTo(map);

        map.addLayer(layer_GoogleSatellite_1);
        setBounds();
        
        // Variables globales para almacenar los marcadores temporales
        var coordSearchMarker = null;
        var rolSearchMarker = null; 
        
        // Función para limpiar cualquier marcador temporal activo y popups de búsqueda
        function cleanUpTemporaryMarkers() {
            if (coordSearchMarker) {
                map.removeLayer(coordSearchMarker);
                coordSearchMarker = null;
            }
            if (rolSearchMarker) {
                map.removeLayer(rolSearchMarker);
                rolSearchMarker = null;
            }
            hideRolSuggestions(); 
        }
        
        const sidebarRight = document.getElementById('sidebar-right');
        const rolInfoDisplay = document.getElementById('rol-info-display');
        const searchInput = document.getElementById('rolInput');
        const searchBtn = document.getElementById('buscarRol');
        const coordenadasInput = document.getElementById('coordenadasInput');
        const buscarCoordenadasBtn = document.getElementById('buscarCoordenadas');
        const resultadoDiv = document.getElementById('resultadoBusqueda');
        const resultadoRolDiv = document.getElementById('resultadoBusquedaRol');
        const rolSugerenciasDiv = document.getElementById('rolSugerencias');
        
        // --- Lógica de buscadores ---

        // Visualizador de coordenadas al mover el mouse
        var MouseCoordinateDisplay = L.Control.extend({
            onAdd: function(map) {
                var container = L.DomUtil.create('div', 'coordinate-display leaflet-control');
                container.id = 'mouseCoordDisplay'; 
                container.innerHTML = `Lat: --.-- Lon: --.--`;
                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);
                return container;
            },
            onRemove: function(map) {}
        });

        var mouseCoordinateDisplay = new MouseCoordinateDisplay({position: 'bottomleft'}).addTo(map);
        var mouseCoordDisplayElement = document.getElementById('mouseCoordDisplay');

        map.on('mousemove', function(e) {
            var lat = e.latlng.lat.toFixed(6); 
            var lon = e.latlng.lng.toFixed(6);
            mouseCoordDisplayElement.innerHTML = `Lat: ${lat} Lon: ${lon}`;
        });

        map.on('mouseout', function() {
            mouseCoordDisplayElement.innerHTML = `Lat: --.-- Lon: --.--`;
        });
        
        // Buscador de Coordenadas
        buscarCoordenadasBtn.addEventListener('click', function() {
            cleanUpTemporaryMarkers(); 

            const inputValue = coordenadasInput.value.trim();
            const parts = inputValue.split(/[,\s]+/);

            resultadoDiv.textContent = '';

            if (parts.length !== 2) {
                resultadoDiv.textContent = 'Formato: Lat, Lon';
                return;
            }

            const lat = parseFloat(parts[0]);
            const lng = parseFloat(parts[1]);

            if (isNaN(lat) || isNaN(lng)) {
                resultadoDiv.textContent = 'Coordenadas inválidas.';
                return;
            }

            map.setView([lat, lng], 15);

            coordSearchMarker = L.marker([lat, lng]).addTo(map);
            const formattedLat = lat.toFixed(6); 
            const formattedLng = lng.toFixed(6);
            coordSearchMarker.bindPopup(`<b>Coordenadas:</b><br>${formattedLat}, ${formattedLng}`).openPopup();

            coordSearchMarker.on('popupclose', function() {
                cleanUpTemporaryMarkers();
            });
        });
        
        coordenadasInput.addEventListener('input', function() {
            resultadoDiv.textContent = '';
        });


        // Buscador de ROL
        var rolIcon = L.divIcon({
            className: 'rol-marker-icon fas fa-map-marker-alt', 
            iconSize: [30, 30],
            iconAnchor: [15, 30], 
            popupAnchor: [0, -25] 
        });

        function hideRolSuggestions() {
            rolSugerenciasDiv.style.display = 'none';
            rolSugerenciasDiv.innerHTML = '';
        }

        rolInput.addEventListener('input', function() {
            resultadoRolDiv.textContent = ''; 
            const searchTerm = rolInput.value.trim().toLowerCase();
            
            if (searchTerm.length < 1) { 
                hideRolSuggestions();
                return;
            }

            const matchingRoles = new Set(); 
            layer_Subdivisiones20232024_2.eachLayer(function(layer) {
                if (layer.feature && layer.feature.properties && layer.feature.properties['rol'] !== null) {
                    const rol = String(layer.feature.properties['rol']).trim().toLowerCase();
                    if (rol.includes(searchTerm)) {
                        matchingRoles.add(rol);
                    }
                }
            });

            const sortedRoles = Array.from(matchingRoles).sort();

            rolSugerenciasDiv.innerHTML = ''; 

            if (sortedRoles.length > 0) {
                sortedRoles.slice(0, 10).forEach(rol => { 
                    const suggestionItem = document.createElement('div');
                    suggestionItem.classList.add('sugerencia-item');
                    suggestionItem.textContent = rol;
                    suggestionItem.addEventListener('mousedown', function(e) { 
                        e.preventDefault(); 
                        rolInput.value = rol; 
                        hideRolSuggestions(); 
                        searchBtn.click(); 
                    });
                    rolSugerenciasDiv.appendChild(suggestionItem);
                });
                rolSugerenciasDiv.style.display = 'block'; 
            } else {
                hideRolSuggestions();
            }
        });

        map.on('click', function(e) {
            if (!sidebarRight.contains(e.originalEvent.target)) {
                hideRolSuggestions();
            }
        });


        rolInput.addEventListener('blur', function() {
            setTimeout(() => { 
                if (!rolSugerenciasDiv.contains(document.activeElement) && document.activeElement !== rolInput) {
                    hideRolSuggestions();
                }
            }, 100);
        });

        searchBtn.addEventListener('click', function() {
            cleanUpTemporaryMarkers(); 

            const rolValue = searchInput.value.trim();
            resultadoRolDiv.textContent = '';
            hideRolSuggestions(); 

            if (!rolValue) {
                resultadoRolDiv.textContent = 'Por favor, ingrese un ROL.';
                return;
            }

            let foundFeature = null;
            layer_Subdivisiones20232024_2.eachLayer(function(layer) {
                if (layer.feature && layer.feature.properties && String(layer.feature.properties['rol']).trim().toLowerCase() === rolValue.toLowerCase()) {
                    foundFeature = layer;
                    return; 
                }
            });

            if (foundFeature) {
                const center = foundFeature.getBounds().getCenter();
                map.setView(center, 17); 

                rolSearchMarker = L.marker(center, {icon: rolIcon}).addTo(map);
                rolSearchMarker.bindPopup(`<b>ROL Encontrado:</b> ${rolValue}`); 
                rolSearchMarker.openPopup(); 

                const rolInfoHtml = pop_Subdivisiones20232024_2(foundFeature.feature, foundFeature);
                rolInfoDisplay.innerHTML = rolInfoHtml;

                rolSearchMarker.on('popupclose', function() {
                    cleanUpTemporaryMarkers(); 
                });

            } else {
                resultadoRolDiv.textContent = `ROL "${rolValue}" no encontrado.`;
                rolInfoDisplay.innerHTML = '<p>No se encontró información para el ROL especificado.</p>';
            }
        });
    </script>
